global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'analytics-dashboard'
    environment: 'production'

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # API Server metrics
  - job_name: 'api'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'api'
          app: 'analytics-dashboard'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
      
  # Web Server metrics (Next.js)
  - job_name: 'web'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'web'
          app: 'analytics-dashboard'
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  # Node Exporter (System metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          
  # Nginx metrics (if nginx-prometheus-exporter is added)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
        labels:
          service: 'nginx'
    honor_timestamps: true
    scrape_interval: 10s
    scrape_timeout: 10s

  # Docker containers metrics (if cadvisor is added)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker'
    metrics_path: '/metrics'
    scrape_interval: 10s